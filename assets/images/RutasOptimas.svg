<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b3d"/>
      <stop offset="100%" stop-color="#081820"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <text x="200" y="46" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="28" fill="#5eead4" text-anchor="middle">Rutas Optimas</text>
  <text x="200" y="68" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">Red vial de Tlaxcala</text>

  <!-- calles de fondo -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.13">
    <line x1="30" y1="120" x2="370" y2="96"/>
    <line x1="30" y1="168" x2="370" y2="150"/>
    <line x1="30" y1="216" x2="370" y2="200"/>
    <line x1="96" y1="86" x2="120" y2="238"/>
    <line x1="180" y1="84" x2="196" y2="238"/>
    <line x1="268" y1="84" x2="284" y2="238"/>
  </g>

  <!-- k-Shortest: ruta alternativa que se separa y vuelve -->
  <path d="M 72,214 L 112,178 L 156,144 L 204,130 L 252,126 L 290,118 L 322,108"
        fill="none" stroke="#16A34A" stroke-width="3" stroke-dasharray="7 5" stroke-linecap="round" opacity="0.85"/>

  <!-- Dijkstra y A* encuentran la MISMA ruta optima: azul abajo, naranja punteado encima -->
  <path d="M 72,214 L 118,196 L 150,170 L 196,158 L 232,140 L 268,126 L 322,108"
        fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
  <path d="M 72,214 L 118,196 L 150,170 L 196,158 L 232,140 L 268,126 L 322,108"
        fill="none" stroke="#F97316" stroke-width="3" stroke-dasharray="6 7" stroke-linecap="round"/>

  <circle cx="72" cy="214" r="8" fill="#22c55e" stroke="#081820" stroke-width="2.5"/>
  <circle cx="322" cy="108" r="8" fill="#ef4444" stroke="#081820" stroke-width="2.5"/>

  <!-- leyenda -->
  <g font-family="monospace" font-size="10">
    <rect x="28" y="236" width="14" height="3" fill="#3B82F6"/>
    <text x="48" y="241" fill="#cbd5e1">Dijkstra</text>
    <rect x="112" y="236" width="14" height="3" fill="#F97316"/>
    <text x="132" y="241" fill="#cbd5e1">A*</text>
    <rect x="166" y="236" width="14" height="3" fill="#16A34A"/>
    <text x="186" y="241" fill="#cbd5e1">k-Shortest</text>
  </g>

  <line x1="28" y1="256" x2="372" y2="256" stroke="#1e3a5f" stroke-width="1"/>
  <text x="200" y="276" font-family="Arial,sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle">React · TypeScript · FastAPI · Leaflet</text>
</svg>
