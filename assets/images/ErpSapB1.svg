<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b2e4f"/>
      <stop offset="100%" stop-color="#05172a"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <text x="200" y="44" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="27" fill="#6cb8f5" text-anchor="middle">SAP Business One</text>
  <text x="200" y="66" font-family="monospace" font-size="12" fill="#9fb6cc" text-anchor="middle">Implementacion de un ERP</text>

  <!-- lineas del hub a cada modulo -->
  <g stroke="#3d7ea6" stroke-width="1.5" opacity="0.65">
    <line x1="200" y1="165" x2="200" y2="100"/>
    <line x1="200" y1="165" x2="262" y2="145"/>
    <line x1="200" y1="165" x2="238" y2="212"/>
    <line x1="200" y1="165" x2="162" y2="212"/>
    <line x1="200" y1="165" x2="138" y2="145"/>
  </g>

  <!-- modulos -->
  <g font-family="Arial,Helvetica,sans-serif" font-size="9" font-weight="bold" fill="#e2eefb" text-anchor="middle">
    <rect x="163" y="88"  width="74" height="22" rx="5" fill="#12456e" stroke="#3d7ea6"/>
    <text x="200" y="103">Ventas</text>
    <rect x="238" y="134" width="74" height="22" rx="5" fill="#12456e" stroke="#3d7ea6"/>
    <text x="275" y="149">Compras</text>
    <rect x="209" y="201" width="74" height="22" rx="5" fill="#12456e" stroke="#3d7ea6"/>
    <text x="246" y="216">Inventario</text>
    <rect x="117" y="201" width="74" height="22" rx="5" fill="#12456e" stroke="#3d7ea6"/>
    <text x="154" y="216">Produccion</text>
    <rect x="88"  y="134" width="74" height="22" rx="5" fill="#12456e" stroke="#3d7ea6"/>
    <text x="125" y="149">Finanzas</text>
  </g>

  <!-- hub central -->
  <rect x="154" y="148" width="92" height="34" rx="7" fill="#0a6ed1" stroke="#6cb8f5" stroke-width="1.5"/>
  <text x="200" y="170" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="15" fill="#ffffff" text-anchor="middle">SAP B1</text>

  <line x1="28" y1="248" x2="372" y2="248" stroke="#1c4a72" stroke-width="1"/>
  <text x="200" y="268" font-family="Arial,sans-serif" font-size="11" fill="#9fb6cc" text-anchor="middle">E-Motion Scooters · RFP · Roadmap · KPIs</text>
</svg>
