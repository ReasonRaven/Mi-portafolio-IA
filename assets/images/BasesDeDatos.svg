<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a38"/>
      <stop offset="100%" stop-color="#04141c"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#bg)"/>

  <text x="200" y="44" font-family="Arial,Helvetica,sans-serif" font-weight="bold" font-size="27" fill="#4fd1e5" text-anchor="middle">Bases de Datos</text>
  <text x="200" y="66" font-family="monospace" font-size="11" fill="#8fb0bd" text-anchor="middle">MySQL · diseno y logica de negocio</text>

  <!-- relaciones (pata de gallo simplificada) -->
  <g stroke="#2b7f96" stroke-width="1.6" fill="none">
    <path d="M 80,152 L 80,190 L 152,196"/>
    <path d="M 320,152 L 320,190 L 248,196"/>
  </g>
  <g stroke="#2b7f96" stroke-width="1.6">
    <line x1="152" y1="196" x2="162" y2="190"/><line x1="152" y1="196" x2="162" y2="202"/>
    <line x1="248" y1="196" x2="238" y2="190"/><line x1="248" y1="196" x2="238" y2="202"/>
  </g>

  <!-- tabla cliente -->
  <rect x="32" y="96" width="96" height="56" rx="4" fill="#0e3646" stroke="#2b7f96"/>
  <rect x="32" y="96" width="96" height="18" rx="4" fill="#00758f"/>
  <text x="80" y="109" font-family="Arial,sans-serif" font-weight="bold" font-size="10" fill="#fff" text-anchor="middle">cliente</text>
  <text x="40" y="129" font-family="monospace" font-size="9" fill="#f29111">PK  id</text>
  <text x="40" y="144" font-family="monospace" font-size="9" fill="#a8c8d4">    nombre</text>

  <!-- tabla producto -->
  <rect x="272" y="96" width="96" height="56" rx="4" fill="#0e3646" stroke="#2b7f96"/>
  <rect x="272" y="96" width="96" height="18" rx="4" fill="#00758f"/>
  <text x="320" y="109" font-family="Arial,sans-serif" font-weight="bold" font-size="10" fill="#fff" text-anchor="middle">producto</text>
  <text x="280" y="129" font-family="monospace" font-size="9" fill="#f29111">PK  id</text>
  <text x="280" y="144" font-family="monospace" font-size="9" fill="#a8c8d4">    existencia</text>

  <!-- tabla venta (la del medio, con las llaves foraneas) -->
  <rect x="152" y="172" width="96" height="64" rx="4" fill="#0e3646" stroke="#4fd1e5" stroke-width="1.4"/>
  <rect x="152" y="172" width="96" height="18" rx="4" fill="#0a6b82"/>
  <text x="200" y="185" font-family="Arial,sans-serif" font-weight="bold" font-size="10" fill="#fff" text-anchor="middle">venta</text>
  <text x="160" y="205" font-family="monospace" font-size="9" fill="#f29111">PK  num</text>
  <text x="160" y="219" font-family="monospace" font-size="9" fill="#4fd1e5">FK  cliente</text>
  <text x="160" y="232" font-family="monospace" font-size="9" fill="#4fd1e5">FK  producto</text>

  <line x1="28" y1="254" x2="372" y2="254" stroke="#16404f" stroke-width="1"/>
  <text x="200" y="274" font-family="Arial,sans-serif" font-size="11" fill="#8fb0bd" text-anchor="middle">Normalizacion · Triggers · Stored Procedures</text>
</svg>
